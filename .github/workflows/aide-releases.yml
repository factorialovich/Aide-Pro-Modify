name: Publish signed AIDE APKs
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aide-release-sync
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/requirements-release.txt
      - run: python tools/sync_github_release.py
        env:
          GH_TOKEN: ${{ github.token }}
          AIDE_UPDATE_PUBLIC_KEY: 
